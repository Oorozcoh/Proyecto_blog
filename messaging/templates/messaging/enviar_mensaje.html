{% extends "blog/base.html" %}

{% block contenido %}
<style>
    .messaging-card {
        max-width: 600px;
        margin: 40px auto;
        background: #0f172a; /* Mismo fondo del perfil */
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 32px;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .messaging-header {
        margin-bottom: 24px;
        border-bottom: 1px solid #1e293b;
        padding-bottom: 16px;
    }
    .messaging-header h2 {
        font-size: 1.4rem;
        margin: 0 0 6px 0;
        color: #f1f5f9;
    }
    .messaging-header p {
        color: #64748b;
        margin: 0;
        font-size: 0.9rem;
    }
    .msg-group {
        margin-bottom: 18px;
    }
    .msg-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 500;
        color: #94a3b8;
        margin-bottom: 6px;
    }
    /* Estiliza selectores, inputs de texto y áreas de mensaje de Django */
    .msg-group input[type="text"],
    .msg-group select,
    .msg-group textarea {
        width: 100%;
        padding: 10px 14px;
        background: #020617;
        border: 1px solid #334155;
        border-radius: 6px;
        color: #f8fafc;
        font-size: 0.9rem;
        box-sizing: border-box;
        font-family: inherit;
        transition: border-color 0.2s;
    }
    .msg-group textarea {
        resize: vertical;
        min-height: 120px;
    }
    .msg-group input:focus,
    .msg-group select:focus,
    .msg-group textarea:focus {
        outline: none;
        border-color: #38bdf8; /* Azul sutil de enfoque */
    }
    .btn-msg {
        background: #f8fafc;
        color: #020617;
        border: none;
        padding: 12px 24px;
        font-size: 0.9rem;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
        width: 100%;
    }
    .btn-msg:hover {
        background: #e2e8f0;
    }
</style>

<div class="messaging-card">
    <div class="messaging-header">
        <h2>Enviar Mensaje Privado</h2>
        <p>Comunícate de forma directa con otros usuarios registrados en la plataforma.</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div>
            {% for field in form %}
                <div class="msg-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <small style="color: #64748b; display: block; margin-top: 4px; font-size: 0.75rem;">{{ field.help_text }}</small>
                    {% endif %}
                </div>
            {% endfor %}
            
            <div style="margin-top: 24px;">
                <button type="submit" class="btn-msg">Enviar Mensaje</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
